<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Parichay</title>
  <meta name="description" content="Sign in to your Parichay account to access your resume analysis history, AI Career Assistant, and tailored recommendations.">
  
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261025_theme2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}?v=20261025_theme2">

  <!-- Immediate Theme Initializer: Strictly Defaults to Light Theme -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('parichay-theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body class="auth-body-canvas">

  <!-- Floating Dark Mode Toggle Button (Assignment Section 5) -->
  <div class="auth-top-toggle">
    <button type="button" id="themeToggleBtn" class="btn-theme-toggle" aria-label="Toggle dark and light theme" title="Toggle theme">
      <span class="theme-icon-light">☀️</span>
      <span class="theme-icon-dark">🌙</span>
    </button>
  </div>

  <div class="auth-page-container">
    <div class="auth-split-card">
      
      <!-- Left Column: Sage Art Canvas with Parichay Brand & Graphic -->
      <div class="auth-art-column">
        <a href="/" class="auth-brand-header" aria-label="Parichay Home">
          <img src="{{ url_for('static', filename='images/parichay-logo.svg') }}" alt="Parichay" class="auth-brand-logo-img">
        </a>

        <div class="auth-art-graphic-wrap">
          <img src="{{ url_for('static', filename='images/parichay-art.svg') }}" alt="Parichay Discovery Artwork" class="auth-graphic-img">
        </div>
      </div>

      <!-- Right Column: Clean Warm Form Canvas -->
      <div class="auth-form-column">
        <div class="auth-form-box">
          <h1 class="auth-title">Welcome<br>back!</h1>
          <p class="auth-subtitle">Sign in to continue your resume journey with Parichay.</p>

          {% if error %}
          <div class="auth-error-banner" role="alert">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <form action="/login" method="POST" class="auth-actual-form">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="auth-input-group">
              <label for="emailInput" class="auth-label">Email address</label>
              <input type="email" id="emailInput" name="email" class="auth-text-input" placeholder="your@email.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="auth-input-group">
              <div class="auth-label-row">
                <label for="passwordInput" class="auth-label">Password</label>
                <a href="#forgot" class="auth-forgot-link" onclick="alert('Password reset instructions will be sent to registered accounts.'); return false;">Forgot password?</a>
              </div>
              <input type="password" id="passwordInput" name="password" class="auth-text-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-auth-submit-pill">
              <span>Log me in</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>

          <div class="auth-switch-row" style="margin-top: 24px;">
            <span>Don't have an account?</span>
            <a href="/signup{% if next_url and next_url != '/studio' %}?next={{ next_url }}{% endif %}" class="auth-switch-link">Sign up</a>
          </div>

          <div class="auth-footer-notes">
            <a href="/">What is Parichay?</a>
            <span>&bull;</span>
            <a href="/terms">Terms of Service</a>
            <span>&bull;</span>
            <a href="/privacy">Privacy Policy</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/theme.js') }}?v=20261025_theme2"></script>
</body>
</html>
